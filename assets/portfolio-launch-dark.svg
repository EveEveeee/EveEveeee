<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">王洋娟的个人网站终端</title>
  <desc id="desc">王洋娟（EveEveeee），AI 产品经理。终端展示产品思维、AI 产品实践、可复用技能与知识库；点击进入 wangyangjuan.surge.sh。</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .title { fill: #e6edf3; font-size: 18px; font-weight: 600; }
    .body { fill: #919ba7; font-size: 17px; }
    .prompt { fill: #58a6ff; font-size: 17px; }
    .ok { fill: #3fb950; font-size: 17px; }
    .cursor { animation: blink 1.15s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="998" height="518" rx="18" fill="#101820" stroke="#30363d" stroke-width="2"/>
  <path d="M19 2H981Q998 2 998 19V53H2V19Q2 2 19 2Z" fill="#161b22"/>
  <path d="M2 53H998" stroke="#30363d"/>
  <circle cx="24" cy="27" r="7" fill="#ff5f57"/><circle cx="47" cy="27" r="7" fill="#febc2e"/><circle cx="70" cy="27" r="7" fill="#28c840"/>
  <text x="500" y="31" text-anchor="middle" fill="#919ba7" font-size="12">wangyangjuan@wyj-mac — EveEveeee — 100×30</text>
  <text x="54" y="93" class="title">王洋娟 OS v2.0.0 — 深色模式</text>
  <text x="54" y="132" class="ok">[ OK ]</text><text x="135" y="132" class="body">Load 产品思维内核 product-thinking.ai</text>
  <text x="54" y="163" class="ok">[ OK ]</text><text x="135" y="163" class="body">Mount /products AI 产品实践</text>
  <text x="54" y="194" class="ok">[ OK ]</text><text x="135" y="194" class="body">Mount /skills 可复用技能</text>
  <text x="54" y="225" class="ok">[ OK ]</text><text x="135" y="225" class="body">Mount /knowledge 知识库</text>
  <text x="54" y="275" class="prompt">wangyangjuan@wyj-mac ~ % whoami</text>
  <text x="54" y="307" class="body">王洋娟 · AI 产品经理</text>
  <text x="54" y="330" fill="#919ba7" font-size="14">GitHub · EveEveeee</text>
  <text x="54" y="365" class="prompt">wangyangjuan@wyj-mac ~ % open wangyangjuan.os</text>
  <rect class="cursor" x="534" y="350" width="10" height="20" fill="#58a6ff"/>
  <text x="54" y="407" class="ok">系统就绪</text>
  <text x="500" y="457" text-anchor="middle" class="title">点击进入王洋娟的个人网站 · wangyangjuan.surge.sh</text>
  <text x="500" y="487" text-anchor="middle" fill="#58a6ff" font-size="22">↗</text>
</svg>
